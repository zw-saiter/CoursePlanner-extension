<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- calendar -->
  <rect x="16" y="24" width="96" height="84" rx="15" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="5"/>

  <!-- rings -->
  <line x1="40" y1="18" x2="40" y2="32" stroke="#ADB5BD" stroke-width="6" stroke-linecap="round"/>
  <line x1="86" y1="18" x2="86" y2="32" stroke="#ADB5BD" stroke-width="6" stroke-linecap="round"/>

  <!-- header line -->
  <line x1="18" y1="46" x2="110" y2="46" stroke="#ADB5BD" stroke-width="5"/>

  <rect x="30" y="54" width="12" height="12" rx="2" fill="#D1D5DB"/>
  <rect x="30" y="70" width="12" height="28" rx="3" fill="#CFE2FF"/>
  
  <rect x="50" y="54" width="12" height="12" rx="2" fill="#D1D5DB"/>
  <rect x="50" y="70" width="12" height="12" rx="2" fill="#F5d1a7"/>
  <rect x="50" y="86" width="12" height="12" rx="2" fill="#D1D5DB"/>
  
  <rect x="70" y="54" width="12" height="28" rx="3" fill="#CFF4FC"/>

  <rect x="90" y="54" width="12" height="12" rx="2" fill="#D1D5DB"/>
  <rect x="90" y="70" width="12" height="12" rx="2" fill="#D1D5DB"/>

  <!-- check -->
  <path d="M78 94 L88 106 L112 80"
        fill="none"
        stroke="#4CAF50"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>